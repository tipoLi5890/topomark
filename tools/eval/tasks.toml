# Navigation eval tasks for tools/eval_nav.py (format: see that file's docstring).
#
# Written before `search`, `locate` and `brief` existed, phrased the way an agent asks:
# a name fragment for `find`, keywords for `search`, the message it saw for `locate`,
# a file or a name for `brief`, a changed file for `tests-for`. Do not tune the
# queries to the tool: when a gold answer moves with the code, update the gold only.
#
# repo = "self" is this repository at `snapshot` below (exported by the eval, so the
# text being searched does not change under the tasks); repo = "synth" is the small
# synthetic repo that tools/synth_repo.py generates (its import chains are fixed files).
# Golds name code at the snapshot. Moving the snapshot is a deliberate step: fix the
# golds that moved, rerun, and record the new numbers in docs/pilots.md.
#
# expect = "miss" marks a control: the command must NOT return the gold (the gold
# still has to exist). It counts under "controls held", never in hit@k or MRR.

snapshot = "v0.2.0"

# ---------------------------------------------------------------- find: a name fragment
[[task]]
id = "find-stamp"
kind = "find"
query = "stamp"
gold = "src/topomark/stamps.py#Stamps"
note = "where do review stamps live; doc headings must not outrank the class"

