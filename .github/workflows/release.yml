name: Release

# Pushing a tag vX.Y.Z (after the steps in CLAUDE.md "Releases") runs the gates CI runs (lint, types,
# the unit tests, the navigation eval, this repository's own code map), then builds the sdist and wheel once,
# records how they were built (build provenance) and what is in them (a CycloneDX SBOM), publishes
# them to PyPI through Trusted Publishing (no token is stored anywhere), then creates the GitHub
# release with the same files. Nothing here runs on branches or pull requests.
#
# One-time setup, by hand:
# - PyPI: add a trusted publisher for this repository, workflow `release.yml`, environment `pypi`.
# - GitHub: create the environment `pypi` with a required reviewer, so every upload waits for a click.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag may point at a commit CI never ran on (a tag pushed without its branch): nothing is built,
  # attested or published from a tree these have not passed on. A job of its own, so the repository's
  # tests never run with the permissions that sign attestations.
  verify:
    name: lint, types, tests, eval, code map
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history with tags: the navigation eval exports the snapshot its tasks name.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ruff and mypy (hash-locked)
        run: python -m pip install --require-hashes -r tools/requirements-ci.txt
      - name: Lint, types, manifests, skill
        run: |
          ruff check src tests tools --extend-exclude tests/fixtures
          mypy
          python tools/sync_codex_manifests.py --check
          python tools/lint_skills.py
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
        env:
          PYTHONUTF8: "1"
      - name: Navigation eval and this repository's code map
        run: |
          python tools/eval_nav.py --fail-under 0.75
          bin/topomark check
        env:
          PYTHONUTF8: "1"

  build:
    name: build, SBOM, provenance
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write       # sign the attestations
      attestations: write   # store them on GitHub
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The tag matches pyproject.toml and every manifest
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$TAG" = "v$version" || { echo "tag $TAG does not match pyproject version $version"; exit 1; }
          python tools/sync_version.py --check
          grep -q "^## \[$version\] - " CHANGELOG.md || { echo "CHANGELOG.md has no [$version] section"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install the build tools (hash-locked)
        run: python -m pip install --require-hashes -r tools/requirements-ci.txt
      - name: Build sdist and wheel
        run: python -m build --no-isolation
      # Syft reads the installed package's metadata (pkg:pypi/topomark@X.Y.Z, MIT); topomark has no
      # dependencies, so the SBOM says what the wheel is and that nothing else comes with it.
      - name: Install the wheel into a folder to describe
        run: |
          python -m pip install --no-deps --no-compile --target "$RUNNER_TEMP/sbom-root" dist/*.whl
          mkdir -p sbom  # the SBOM action writes its output file but does not create the folder
      # One component (the package, not each of its files), named after the package rather than the
      # runner's temporary folder.
      - name: SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          SYFT_FILE_METADATA_SELECTION: none
          SYFT_SOURCE_NAME: topomark
          SYFT_SOURCE_VERSION: ${{ steps.version.outputs.version }}
        with:
          path: ${{ runner.temp }}/sbom-root
          format: cyclonedx-json
          output-file: sbom/topomark-${{ steps.version.outputs.version }}.cdx.json
          syft-version: v1.55.0
          upload-artifact: false
          upload-release-assets: false
      - name: Build provenance for the sdist and wheel
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Attest the SBOM to the wheel
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: "dist/*.whl"
          sbom-path: sbom/topomark-${{ steps.version.outputs.version }}.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/topomark
    permissions:
      id-token: write  # Trusted Publishing; PyPI also stores a PEP 740 attestation per file
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub release
    needs: [build, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # create the release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom/
      - name: Release notes from CHANGELOG.md, then the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\] - " {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$TAG" dist/* sbom/* --repo "$GITHUB_REPOSITORY" --title "topomark $VERSION" \
            --notes-file notes.md --verify-tag
