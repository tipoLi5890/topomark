name: CI

# Linux on the oldest and newest supported Python, macOS and Windows in between; superseded runs
# are cancelled.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff, mypy, manifests, skills)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Dev tools live only in CI; topomark itself has zero dependencies. Versions and hashes are
      # locked in tools/requirements-ci.txt (regenerate it from tools/requirements-ci.in).
      # tests/fixtures holds deliberately broken sources (scanner edge cases); never lint them.
      - name: Install ruff and mypy (hash-locked)
        run: python -m pip install --require-hashes -r tools/requirements-ci.txt
      - name: ruff check
        run: ruff check src tests tools --extend-exclude tests/fixtures
      - name: mypy (scope in pyproject [tool.mypy].files)
        run: mypy
      - name: Manifest versions match pyproject
        run: python tools/sync_version.py --check
      - name: Codex manifests generated from .claude-plugin
        run: python tools/sync_codex_manifests.py --check
      - name: Skill frontmatter and size
        run: python tools/lint_skills.py

  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (stdlib unittest)
        run: python -m unittest discover -s tests -t .
        env:
          PYTHONUTF8: "1"

  cli-smoke:
    name: cli smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: bin/topomark is executable
        run: test -x bin/topomark
      - name: bin/topomark --version (clean checkout, no install)
        run: bin/topomark --version
      - name: capabilities --json
        run: PYTHONPATH=src python -m topomark capabilities --json
      - name: init --dry-run on this repo writes nothing
        run: |
          before=$(git status --porcelain --untracked-files=all)
          bin/topomark init --dry-run
          test "$before" = "$(git status --porcelain --untracked-files=all)"
      - name: this repo's own code map is in sync (topomark check)
        run: bin/topomark check

  eval:
    name: navigation eval (pinned snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history with tags: the eval exports the snapshot its tasks name (tools/eval/tasks.toml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Golds are checked first (exit 2 when one is stale). The floor sits under the recorded
      # MRR (docs/pilots.md): a ranking change that costs more than that has to be deliberate.
      - name: eval_nav.py on the snapshot
        run: python tools/eval_nav.py --fail-under 0.75
        env:
          PYTHONUTF8: "1"

  package:
    name: package (build, install the wheel, run it)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # --no-isolation: the build backend comes from the hash-locked file too, not a fresh download.
      - name: Build sdist and wheel
        run: |
          python -m pip install --require-hashes -r tools/requirements-ci.txt
          python -m build --no-isolation
      # From outside the checkout, so the templates can only come from the wheel's package data.
      - name: Installed topomark runs and finds its templates
        run: |
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          topomark --version
          topomark -C "$GITHUB_WORKSPACE" init --dry-run
